name: excellense-mono

services:
  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:?VITE_NODE_ENV is required}
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    ports:
      - ${LANDING_PORT}:${LANDING_PORT}
      - ${ADMIN_PORT}:${ADMIN_PORT}
      - ${SERVER_PORT}:${SERVER_PORT}
    environment:
      LANDING_PORT: ${LANDING_PORT:?LANDING_PORT is required}
      ADMIN_PORT: ${ADMIN_PORT:?ADMIN_PORT is required}
      SERVER_PORT: ${SERVER_PORT:?SERVER_PORT is required}
      API_PORT: ${API_PORT:?API_PORT is required}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      API_PORT: ${API_PORT:?API_PORT is required}
      APP_NAME: ${APP_NAME:?APP_NAME is required}
      ALLOWED_ORIGIN_PATTERNS: ${ALLOWED_ORIGIN_PATTERNS:?ALLOWED_ORIGIN_PATTERNS is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:?DB_USER is required} -d ${DB_NAME:?DB_NAME is required}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
        '--appendonly',
        'yes',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  db_data:
  redis_data:
