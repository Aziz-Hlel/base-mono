name: base-monorepo-v2-local

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - ${DB_PORT:?DB_PORT is required}:5432
    volumes:
      - db_volume:/var/lib/postgresql/data

  redis:
    image: redis:latest

    ports:
      - ${REDIS_PORT:?REDIS_PORT is required}:6379
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
    volumes:
      - redis_volume:/data

    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-password}', '--appendonly', 'yes']

  minio:
    image: quay.io/minio/minio:latest

    ports:
      - ${MINIO_PORT:?MINIO_PORT is required}:9000
      - ${MINIO_UI_PORT:?MINIO_UI_PORT is required}:9001 # Web UI

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_volume:/data

    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}

    volumes:
      - ../scripts/init_minio.sh:/init_minio.sh:ro
      - ../seed/minio:/seed:ro

    entrypoint: ['/bin/sh', '/init_minio.sh']

  mailpit:
    image: axllent/mailpit
    ports:
      - ${SMTP_UI_PORT:?SMTP_UI_PORT is required}:8025 # Web UI
      - ${SMTP_PORT:?SMTP_PORT is required}:1025

volumes:
  db_volume:
  redis_volume:
  minio_volume:
